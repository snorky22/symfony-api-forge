resource: checkouts
type: checkouts
object:
    shape: |-
        array{
            type: string,
            id: string,
            attributes: array{
                store_id: int,
                variant_id: int,
                custom_price: int,
                product_options: array{
                    name: string,
                    description: string,
                    media: list<mixed>,
                    redirect_url: string,
                    receipt_button_text: string,
                    receipt_link_url: string,
                    receipt_thank_you_note: string,
                    enabled_variants: list<int>,
                },
                checkout_options: array{
                    embed: bool,
                    media: bool,
                    logo: bool,
                    desc: bool,
                    discount: bool,
                    skip_trial: bool,
                    subscription_preview: bool,
                    button_color: string,
                },
                checkout_data: array{
                    email: string,
                    name: string,
                    billing_address: list<mixed>,
                    tax_number: string,
                    discount_code: string,
                    custom: list<mixed>,
                    variant_quantities: list<mixed>,
                },
                preview: array{
                    currency: string,
                    currency_rate: int,
                    subtotal: int,
                    discount_total: int,
                    tax: int,
                    total: int,
                    subtotal_usd: int,
                    discount_total_usd: int,
                    tax_usd: int,
                    total_usd: int,
                    subtotal_formatted: string,
                    discount_total_formatted: string,
                    tax_formatted: string,
                    total_formatted: string,
                },
                expires_at: string,
                created_at: string,
                updated_at: string,
                test_mode: bool,
                url: string,
            },
            relationships: array{
                store: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                variant: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
            },
            links: array{
                self: string,
            },
        }
    review:
        - 'object: "list<mixed>" marks empty arrays in the example, they may be empty objects'
operations:
    create:
        method: POST
        path: checkouts
        body:
            attributes:
                shape: |-
                    array{
                        custom_price?: int,
                        product_options?: array{
                            enabled_variants: list<int>,
                        },
                        checkout_options?: array{
                            button_color: string,
                        },
                        checkout_data?: array{
                            discount_code: string,
                            custom: array{
                                user_id: int,
                            },
                        },
                        expires_at?: string,
                        preview?: bool,
                    }
            relationships:
                store: stores
                variant: variants
        response:
            data: object
        review:
            - 'request body: all attributes are typed as optional, remove the "?" of the required ones'
