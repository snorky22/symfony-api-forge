resource: orders
type: orders
object:
    shape: |-
        array{
            type: string,
            id: string,
            attributes: array{
                store_id: int,
                customer_id: int,
                affiliate_id?: int,
                referral_amount?: int,
                identifier: string,
                order_number: int,
                user_name: string,
                user_email: string,
                currency: string,
                currency_rate: string,
                subtotal: int|float,
                setup_fee?: int,
                discount_total: int,
                tax: int|float,
                total: int|float,
                subtotal_usd: int,
                setup_fee_usd?: int,
                discount_total_usd: int,
                tax_usd: int,
                total_usd: int,
                tax_name: string,
                tax_rate: string,
                tax_inclusive?: bool,
                status: string,
                status_formatted: string,
                refunded: ?bool,
                refunded_at: mixed,
                subtotal_formatted: string,
                setup_fee_formatted?: string,
                discount_total_formatted: string,
                tax_formatted: string,
                total_formatted: string,
                first_order_item: array{
                    id?: int,
                    order_id: int,
                    product_id: int,
                    variant_id: int,
                    product_name: string,
                    variant_name: string,
                    price: int,
                    created_at: string,
                    updated_at: string,
                    deleted_at?: mixed,
                    test_mode: bool,
                },
                urls: array{
                    receipt: string,
                },
                created_at: string,
                updated_at: string,
                test_mode: bool,
            },
            relationships?: array{
                store: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                customer: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                affiliate?: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                'order-items': array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                subscriptions: array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                'license-keys': array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
                'discount-redemptions': array{
                    links: array{
                        related: string,
                        self: string,
                    },
                },
            },
            links?: array{
                self: string,
            },
        }
    review:
        - 'object: "mixed" marks values that are null in the example, their real type is unknown'
operations:
    list:
        method: GET
        path: orders
        query:
            'filter[user_email]':
                type: string
                required: false
                example: johndoe@example.com
        response:
            data: list
        review:
            - 'query parameters are assumed optional'
    get:
        method: GET
        path: 'orders/{id}'
        parameters:
            id:
                example: '1'
        response:
            data: object
        review:
            - 'path parameter {id} guessed from the example value "1"'
            - 'no response example: assumed to be a JSON:API document of the resource'
